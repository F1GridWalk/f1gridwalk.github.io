<!doctype html><meta charset=utf-8><style>
body{margin:0}.c{width:1280px;height:670px;position:relative;overflow:hidden;background:#1F2420;color:#fff;font-family:'Noto Sans CJK JP',sans-serif}
.p{position:absolute;left:0;top:0;width:290px;height:670px;background:#E8946C;color:#1F2420;display:flex;align-items:center;justify-content:center}
.p b{writing-mode:vertical-rl;font-weight:900;font-size:240px;line-height:1}
.r{position:absolute;left:330px;right:36px;top:40px;bottom:100px;display:flex;flex-direction:column;justify-content:center}
.l1,.l2{font-weight:900;white-space:nowrap;line-height:1.12}
.l1{font-size:150px}.l2{font-size:240px;color:#FFB089}
.s{position:absolute;left:330px;right:250px;bottom:40px;font-size:30px;font-weight:700;color:#D9D4C8;white-space:nowrap}
.br{position:absolute;right:36px;bottom:34px;font:700 28px Georgia,serif}.br small{display:block;font:700 11px 'Noto Sans CJK JP';letter-spacing:.24em;opacity:.7}
</style><div class=c><div class=p><b>余談</b></div><div class=r><div class=l1>F1の表彰台に</div><div class=l2>バラ水</div></div><div class=s>マレーシアで開くバーレーンGP、こぼれ話5つ</div><div class=br>Grid Walk<small>WORLD F1 DESK</small></div></div>
<script>
const W=document.querySelector('.r').clientWidth;
document.querySelectorAll('.l1,.l2,.s').forEach(el=>{let f=parseFloat(getComputedStyle(el).fontSize);while(el.scrollWidth>el.clientWidth+1&&f>20){f-=2;el.style.fontSize=f+'px'}});
const r=document.querySelector('.r');let n=0;while(r.scrollHeight>r.clientHeight+1&&n++<60){document.querySelectorAll('.l1,.l2').forEach(el=>{el.style.fontSize=(parseFloat(getComputedStyle(el).fontSize)-3)+'px'})}
</script>
