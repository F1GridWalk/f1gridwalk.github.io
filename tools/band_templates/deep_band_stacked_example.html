</style><div class=c><div class=pil><div class=st><b class=f>DEEP</b><b class=f>GRID</b><i class=f>#04</i></div></div><div class=r><div class=l>9年前は</div><div class=l><em>1回</em>だった</div></div><div class=s>今年は2回か3回か — F1セパンのピット作戦</div><div class=br>Grid Walk<small>WORLD F1 DESK</small></div></div>
<script>
function fitW(el,w){let f=parseFloat(getComputedStyle(el).fontSize);while(el.scrollWidth>w&&f>10){f-=2;el.style.fontSize=f+'px'}}
document.querySelectorAll('.st .f').forEach(el=>{el.style.display='inline-block';fitW(el,296)});
const st=document.querySelector('.st');if(st){let n=0;while(st.getBoundingClientRect().height>640&&n++<200)st.querySelectorAll('.f').forEach(el=>el.style.fontSize=(parseFloat(getComputedStyle(el).fontSize)-2)+'px')}
const vt=document.querySelector('.vt');if(vt){let f=400;while((vt.getBoundingClientRect().height>560||vt.getBoundingClientRect().width>320)&&f>20){f-=2;vt.style.fontSize=f+'px'}vt.parentElement.style.justifyContent='flex-start';vt.style.marginTop='18px'}
const r=document.querySelector('.r');const W=r.clientWidth;
document.querySelectorAll('.l').forEach(el=>{el.style.display='inline-block';fitW(el,W)});
let n=0;while(r.scrollHeight>r.clientHeight&&n++<200)document.querySelectorAll('.l').forEach(el=>el.style.fontSize=(parseFloat(getComputedStyle(el).fontSize)-2)+'px');
fitW(document.querySelector('.s'),document.querySelector('.s').clientWidth);
</script>
